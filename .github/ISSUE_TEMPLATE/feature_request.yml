name: Feature request
description: Propose a product or engineering improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour, not only the implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discovery and matching
        - Listings and animals
        - Messaging and notifications
        - Accounts and privacy
        - Telegram bot
        - Telegram Mini App
        - Admin and moderation
        - Payments
        - Design and accessibility
        - Infrastructure and docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This request does not require exposing private user data.
          required: true
        - label: I checked the master prompt requirements for this area.
          required: true
