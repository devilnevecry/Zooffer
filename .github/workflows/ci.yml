name: CI

on:
  push:
    branches: ["main", "phase/**", "fix/**", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONPATH: "backend"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zooffer
          POSTGRES_PASSWORD: zooffer_dev_password
          POSTGRES_DB: zooffer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zooffer -d zooffer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            bot/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
          python -m pip install -e bot
          python -m pip install bandit==1.7.10

      - name: Ruff lint
        run: ruff check backend scripts bot

      - name: Ruff format
        run: ruff format --check backend scripts bot

      - name: Mypy (shared backend)
        run: mypy backend/zooffer

      - name: Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://zooffer:zooffer_dev_password@localhost:5432/zooffer_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests -q

  web:
    name: Web (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  security:
    name: Security (bandit, gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install bandit
        run: python -m pip install bandit==1.7.10

      - name: Bandit
        run: bandit -q -r backend/zooffer bot/zooffer_bot -x tests -ll

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            detect --source=/repo --redact --no-banner -v

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
          python -m pip install pip-audit==2.7.3

      - name: pip-audit
        run: pip-audit --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
