name: zooffer-prod-vps

# Public host: TLS + Next.js website. The API/media/bot stay on the PC and are
# reached through a tunnel address (Tailscale/WireGuard/Cloudflare).
# Copy infra/vps.env.example to infra/.env and fill every value.
# Start with: docker compose -f infra/compose.prod.vps.yaml up -d --build

services:
  web:
    image: zooffer/web:latest
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://${ZOOFER_DOMAIN}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL}
        NEXT_PUBLIC_TELEGRAM_MINI_APP_URL: ${NEXT_PUBLIC_TELEGRAM_MINI_APP_URL}
        NEXT_PUBLIC_TELEGRAM_CHANNEL_URL: ${NEXT_PUBLIC_TELEGRAM_CHANNEL_URL}
        API_INTERNAL_URL: ${ZOOFER_BACKEND_UPSTREAM}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      APP_BASE_URL: https://${ZOOFER_DOMAIN}
      API_BASE_URL: https://${ZOOFER_DOMAIN}
      PUBLIC_API_URL: https://${ZOOFER_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${ZOOFER_DOMAIN}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL}
      NEXT_PUBLIC_TELEGRAM_MINI_APP_URL: ${NEXT_PUBLIC_TELEGRAM_MINI_APP_URL}
      NEXT_PUBLIC_TELEGRAM_CHANNEL_URL: ${NEXT_PUBLIC_TELEGRAM_CHANNEL_URL}
      API_INTERNAL_URL: ${ZOOFER_BACKEND_UPSTREAM}
      MEDIA_PUBLIC_BASE_URL: https://${ZOOFER_DOMAIN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZOOFER_DOMAIN: ${ZOOFER_DOMAIN}
      ZOOFER_EMAIL: ${ZOOFER_EMAIL}
      ZOOFER_BACKEND_UPSTREAM: ${ZOOFER_BACKEND_UPSTREAM}
      ZOOFER_BOT_UPSTREAM: ${ZOOFER_BOT_UPSTREAM}
      ZOOFER_WEB_UPSTREAM: http://web:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
