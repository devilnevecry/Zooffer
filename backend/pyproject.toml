[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zooffer"
version = "0.1.0"
description = "Zooffer backend — animal discovery and marketplace platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "email-validator==2.3.0",
  "argon2-cffi==23.1.0",
  "cryptography==50.0.2",
  "python-multipart==0.0.32",
  "redis==5.2.1",
  "structlog==24.4.0",
  "prometheus-client==0.26.0",
  "pillow==13.0.0",
  "aiogram==3.31.0",
  "pyotp==2.10.0",
  "aiosmtplib==5.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==1.14.1",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "types-passlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zooffer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:zooffer.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]
"zooffer/config.py" = ["S105"]
"zooffer/core/enums.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
