[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zooffer"
version = "0.1.0"
description = "Zooffer backend — animal discovery and marketplace platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  "redis==5.2.1",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "pillow==13.0.0",
  "aiogram==3.31.0",
  "pyotp==2.9.0",
  "aiosmtplib==3.0.2",
  "boto3==1.35.90",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==1.14.1",
  "types-passlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zooffer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:zooffer.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]
"zooffer/config.py" = ["S105"]
"zooffer/core/enums.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
